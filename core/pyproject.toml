[project]
name = "core"
version = "0.1.0"
description = "Shared domain models, hazard weights and capacity norms. Pure Python — no geo/ML deps."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "h3>=4.1",
  "ortools>=9.10",
  "argon2-cffi>=25.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
